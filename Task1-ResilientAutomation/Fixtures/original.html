<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Original Form Structure</title>
    <style>body { font-family: sans-serif; padding: 20px; } .form-group { margin-bottom: 15px; }</style>
</head>
<body>
    <h2>CloudQA Practice Form (Original)</h2>
    <form>
        <div class="form-group col-xs-6">
            <label for="fname" class="control-label">First Name</label>
            <input id="fname" type="text" name="First Name" class="form-control" placeholder="Name" />
        </div>
        <div class="form-group col-xs-6">
            <label class="control-label">Gender</label>
            <div>
                <input id="male" type="radio" name="gender" value="Male" />
                <span name="male" for="male">Male</span>
                <input id="female" type="radio" name="gender" value="Female" />
                <span name="female" for="female">Female</span>
            </div>
        </div>
        <div class="form-group col-xs-6">
            <label for="state" class="control-label">State</label>
            <select class="form-control" id="state" name="State">
                <option value="">-- Select Country/State --</option>
                <option value="Afganistan">Afganistan</option>
                <option value="India">India</option>
                <option value="United States">United States</option>
            </select>
        </div>
    </form>
</body>
</html>
