<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reordered Fields</title>
</head>
<body>
    <h2>Form with Flipped Field Ordering</h2>
    <form>
        <!-- State is now FIRST -->
        <div class="field-wrapper">
            <label for="state_dropdown">State</label>
            <select id="state_dropdown" name="user_state">
                <option value="">Select State</option>
                <option value="India">India</option>
                <option value="United States">United States</option>
            </select>
        </div>

        <!-- Gender is now SECOND -->
        <fieldset>
            <legend>Gender</legend>
            <input type="radio" id="g_male" name="gender_choice" value="Male">
            <label for="g_male">Male</label>
            <input type="radio" id="g_female" name="gender_choice" value="Female">
            <label for="g_female">Female</label>
        </fieldset>

        <!-- First Name is now LAST -->
        <div class="field-wrapper">
            <label for="first_name_input">First Name</label>
            <input id="first_name_input" type="text" name="first_name" />
        </div>
    </form>
</body>
</html>
