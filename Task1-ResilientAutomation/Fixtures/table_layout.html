<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Table Layout Form</title>
</head>
<body>
    <h2>Form in Legacy HTML Table (No For Attributes)</h2>
    <table border="1">
        <tr>
            <td>First Name</td>
            <td><input type="text" name="txt1" /></td>
        </tr>
        <tr>
            <td>Gender</td>
            <td>
                <label><input type="radio" name="r1" value="Male" /> Male</label>
                <label><input type="radio" name="r1" value="Female" /> Female</label>
            </td>
        </tr>
        <tr>
            <td>State</td>
            <td>
                <select name="sel1">
                    <option value="none">-- Select --</option>
                    <option value="in">India</option>
                    <option value="us">United States</option>
                </select>
            </td>
        </tr>
    </table>
</body>
</html>
